[package]
name = "cytiq-cytonorm"
version.workspace = true
edition.workspace = true

[dependencies]
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
cytiq-density = { path = "../cytiq-density" }
cytiq-fcs = { path = "../cytiq-fcs" }
cytiq-flowsom = { path = "../cytiq-flowsom" }
cytiq-mask = { path = "../cytiq-mask" }
cytiq-provenance = { path = "../cytiq-provenance" }
cytiq-publish = { path = "../cytiq-publish" }
log = "0.4.30"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
plotly = "0.14.1"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-saphyr = "2.0.0"
tempfile = "3"
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
cytiq-transform = { path = "../cytiq-transform" }
