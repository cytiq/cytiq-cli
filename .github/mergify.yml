pull_request_rules:
  - name: Auto-merge Dependabot updates
    conditions:
      - author=dependabot[bot]
      - base=main
      - check-success=check
      - check-success=fmt
      - check-success=clippy
      - check-success=test
    actions:
      merge:
        method: squash
merge_protections_settings:
  reporting_method: check-runs
