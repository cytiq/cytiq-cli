[package]
name = "cytiq-classify"
version.workspace = true
edition.workspace = true

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
cytiq-fcs = { path = "../cytiq-fcs" }
cytiq-mask = { path = "../cytiq-mask" }
cytiq-provenance = { path = "../cytiq-provenance" }
cytiq-publish = { path = "../cytiq-publish" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-27"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
serde-saphyr = "2.0.0"
ryu = "1.0.23"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2"

[lints]
workspace = true
