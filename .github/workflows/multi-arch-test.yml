# TEMPORARY: exercises cytiq-ci's multi-arch docker-publish.yml from its branch
# before it is tagged. Pushes ghcr.io/cytiq/cytiq-cli:ci-test-multiarch.
# Dropped from this branch before the PR is opened.
name: multi-arch test

on:
  push:
    branches: [ci/multi-arch-image]

permissions:
  contents: read

jobs:
  build-and-push:
    uses: cytiq/cytiq-ci/.github/workflows/docker-publish.yml@feat/multi-arch-docker-publish
    with:
      image: cytiq-cli
      dockerfile: docker/Dockerfile
      version: ci-test-multiarch
      ref: ${{ github.sha }}
      build_args: |
        CYTIQ_BUILD_COMMIT=${{ github.sha }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
