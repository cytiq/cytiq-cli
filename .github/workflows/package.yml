name: Package

# The release build (fat LTO, one codegen unit) takes about six minutes, so it
# runs only when packaging can change, weekly to catch drift, and on demand.
# The image installs the release binary outside `target/` and runs it with no
# ONNX Runtime environment, which also covers the relocated release build.

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - crates/*/build.rs
      - crates/cytiq-classify/**
      - data/fixtures/classify/**
      - docker/**
      - .dockerignore
      - .github/workflows/package.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    # A merge-queue draft repeats a pull request that already ran this job.
    if: ${{ !startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        run: docker buildx build --load -f docker/Dockerfile -t cytiq:ci .

      - name: Smoke-test the image
        run: docker run --rm cytiq:ci --help

      - name: Smoke-test model inference in the image
        run: |
          for kind in catboost lightgbm; do
            docker run --rm \
              -v "${{ github.workspace }}/data/fixtures/classify:/fixtures:ro" \
              cytiq:ci classify --input /fixtures/raw.fcs \
              --model "/fixtures/$kind" --output "/tmp/$kind" --threads 1
          done
