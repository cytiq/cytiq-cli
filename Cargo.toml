[workspace]
members = [
    "crates/cytiq-cytonorm",
    "crates/cytiq-classify",
    "crates/cytiq-autospectral",
    "crates/cytiq-autospill",
    "crates/cytiq-clean",
    "crates/cytiq-compensate",
    "crates/cytiq-engine",
    "crates/cytiq-cytoscan",
    "crates/cytiq-density",
    "crates/cytiq-fcs",
    "crates/cytiq-gating",
    "crates/cytiq-manifest",
    "crates/cytiq-mask",
    "crates/cytiq-meta",
    "crates/cytiq-flowsom",
    "crates/cytiq-peacoqc",
    "crates/cytiq-plot",
    "crates/cytiq-preflight",
    "crates/cytiq-provenance",
    "crates/cytiq-publish",
    "crates/cytiq-qc",
    "crates/cytiq-spillqc",
    "crates/cytiq-stats",
    "crates/cytiq-transform",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cytiq/cytiq-engine"
keywords = ["cytometry", "flow-cytometry", "fcs", "bioinformatics"]
categories = ["science"]

# Library crates of this workspace. crates.io resolves the version, local builds
# the path. Keep each version equal to the workspace version above: packages
# are published together, and `just package-check` rejects a mismatch.
[workspace.dependencies]
cytiq-autospectral = { path = "crates/cytiq-autospectral", version = "0.4.0" }
cytiq-autospill = { path = "crates/cytiq-autospill", version = "0.4.0" }
cytiq-classify = { path = "crates/cytiq-classify", version = "0.4.0" }
cytiq-clean = { path = "crates/cytiq-clean", version = "0.4.0" }
cytiq-compensate = { path = "crates/cytiq-compensate", version = "0.4.0" }
cytiq-cytonorm = { path = "crates/cytiq-cytonorm", version = "0.4.0" }
cytiq-cytoscan = { path = "crates/cytiq-cytoscan", version = "0.4.0" }
cytiq-density = { path = "crates/cytiq-density", version = "0.4.0" }
cytiq-fcs = { path = "crates/cytiq-fcs", version = "0.4.0" }
cytiq-flowsom = { path = "crates/cytiq-flowsom", version = "0.4.0" }
cytiq-gating = { path = "crates/cytiq-gating", version = "0.4.0" }
cytiq-manifest = { path = "crates/cytiq-manifest", version = "0.4.0" }
cytiq-mask = { path = "crates/cytiq-mask", version = "0.4.0" }
cytiq-meta = { path = "crates/cytiq-meta", version = "0.4.0" }
cytiq-peacoqc = { path = "crates/cytiq-peacoqc", version = "0.4.0" }
cytiq-plot = { path = "crates/cytiq-plot", version = "0.4.0" }
cytiq-preflight = { path = "crates/cytiq-preflight", version = "0.4.0" }
cytiq-provenance = { path = "crates/cytiq-provenance", version = "0.4.0" }
cytiq-publish = { path = "crates/cytiq-publish", version = "0.4.0" }
cytiq-qc = { path = "crates/cytiq-qc", version = "0.4.0" }
cytiq-spillqc = { path = "crates/cytiq-spillqc", version = "0.4.0" }
cytiq-stats = { path = "crates/cytiq-stats", version = "0.4.0" }
cytiq-transform = { path = "crates/cytiq-transform", version = "0.4.0" }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Integer overflow aborts instead of wrapping silently. Measured on the parity
# suite and a 225 MB spectral PeacoQC run: no difference beyond noise.
overflow-checks = true
panic = "abort"
strip = "symbols"
