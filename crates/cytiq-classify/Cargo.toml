[package]
name = "cytiq-classify"
version.workspace = true
edition.workspace = true

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
cytiq-fcs = { path = "../cytiq-fcs" }
cytiq-mask = { path = "../cytiq-mask" }
cytiq-provenance = { path = "../cytiq-provenance" }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3"
thiserror = "2"

[lints]
workspace = true
