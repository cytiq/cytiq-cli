[package]
name = "cytiq-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cytiq"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
cytiq-autospectral = { path = "../cytiq-autospectral" }
cytiq-autospill = { path = "../cytiq-autospill" }
cytiq-clean = { path = "../cytiq-clean" }
cytiq-cytoscan = { path = "../cytiq-cytoscan" }
cytiq-flowsom = { path = "../cytiq-flowsom" }
cytiq-gating = { path = "../cytiq-gating" }
cytiq-mask = { path = "../cytiq-mask" }
cytiq-meta = { path = "../cytiq-meta" }
cytiq-peacoqc = { path = "../cytiq-peacoqc" }
cytiq-transform = { path = "../cytiq-transform" }
log = "0.4.30"

[dev-dependencies]
arrow-array = "58.3.0"
csv = "1.3.1"
cytiq-fcs = { path = "../cytiq-fcs" }
parquet = { version = "58.3.0", default-features = false, features = ["arrow"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[lints]
workspace = true
