[package]
name = "cytiq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "science"]
description = "Command-line tool for flow cytometry preprocessing, quality control and analysis of FCS files"

[[bin]]
name = "cytiq"
path = "src/main.rs"

[dependencies]
cytiq-cytonorm.workspace = true
cytiq-classify.workspace = true
clap = { version = "4.5.38", features = ["derive"] }
cytiq-autospectral.workspace = true
cytiq-autospill.workspace = true
cytiq-clean.workspace = true
cytiq-compensate.workspace = true
cytiq-cytoscan.workspace = true
cytiq-fcs.workspace = true
cytiq-flowsom.workspace = true
cytiq-gating.workspace = true
cytiq-mask.workspace = true
cytiq-meta.workspace = true
cytiq-peacoqc.workspace = true
cytiq-plot.workspace = true
cytiq-preflight.workspace = true
cytiq-provenance.workspace = true
cytiq-qc.workspace = true
cytiq-spillqc.workspace = true
cytiq-stats.workspace = true
cytiq-transform.workspace = true
log = "0.4.30"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3"
arrow-array = "60.1.0"
csv = "1.3.1"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
sha2 = "0.11.1"

[lints]
workspace = true
