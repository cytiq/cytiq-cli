name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --workspace --locked

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Python for ONNX Runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install CPU ONNX Runtime for inference tests
        run: |
          python -m venv "$RUNNER_TEMP/ort-venv"
          "$RUNNER_TEMP/ort-venv/bin/pip" install onnxruntime==1.25.1
          "$RUNNER_TEMP/ort-venv/bin/python" - <<'PYTHON'
          import os
          from pathlib import Path
          import onnxruntime
          capi = Path(onnxruntime.__file__).parent / 'capi'
          library = list(capi.glob('libonnxruntime.so.*')) + list(capi.glob('libonnxruntime.*.dylib'))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'ORT_DYLIB_PATH={library[0]}\n')
          PYTHON

      - name: Run tests
        run: cargo test --workspace --locked

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        run: docker buildx build --load -f docker/Dockerfile -t cytiq:ci .

      - name: Smoke-test the image
        run: docker run --rm cytiq:ci --help

      - name: Smoke-test model inference in the image
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/data/fixtures/classify:/fixtures:ro"
          cytiq:ci classify --input /fixtures/raw.fcs
          --model /fixtures/catboost --output /tmp/classified
