name: Parity

# Scientific parity against the upstream R/Python tools: synthetic datasets
# (parity/run_all.sh) and real acquisitions (parity/real/run_real.sh). Any
# violated rule in parity/tolerances.json or parity/real/tolerances.json fails
# the job. Too slow for every PR, so it runs nightly, on demand, and on PRs
# that change the harness itself.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "parity/**"
      - ".github/workflows/parity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends time libcurl4-openssl-dev \
            libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libglpk-dev libgmp-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache the R library and upstream sources
        uses: actions/cache@v4
        with:
          path: |
            parity/.env/Rlib
            parity/.env/*-src
          key: parity-r-${{ runner.os }}-${{ hashFiles('parity/setup_env.sh') }}

      - name: Install the upstream tools
        run: parity/setup_env.sh

      - name: Synthetic parity
        run: parity/run_all.sh

      - name: Real-data parity
        run: parity/real/run_real.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: |
            parity/results/
            parity/versions.txt
            parity/.out/**/*.log
            parity/.out/**/*.time
          if-no-files-found: ignore
