[package]
name = "cytiq-autospill"
version.workspace = true
edition.workspace = true

[dependencies]
arrow-array = "58.3.0"
arrow-schema = "58.1.0"
csv = "1.3.1"
cytiq-density = { path = "../cytiq-density" }
cytiq-fcs = { path = "../cytiq-fcs" }
cytiq-publish = { path = "../cytiq-publish" }
cytiq-transform = { path = "../cytiq-transform" }
log = "0.4.30"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
ndarray = "0.17.2"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
plotly = "0.14.1"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.17"

[lints]
workspace = true
