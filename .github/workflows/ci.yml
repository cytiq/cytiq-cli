name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --workspace --locked

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Verify classification with a relocated build and no runtime environment
        run: |
          cargo build -p cytiq-cli --release --locked
          mkdir -p "$RUNNER_TEMP/cytiq-dist"
          cp target/release/cytiq "$RUNNER_TEMP/cytiq-dist/"
          env -u ORT_DYLIB_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            "$RUNNER_TEMP/cytiq-dist/cytiq" classify \
            --input data/fixtures/classify/raw.fcs \
            --model data/fixtures/classify/lightgbm \
            --output "$RUNNER_TEMP/relocated-classification" --threads 1

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        run: docker buildx build --load -f docker/Dockerfile -t cytiq:ci .

      - name: Smoke-test the image
        run: docker run --rm cytiq:ci --help

      - name: Smoke-test model inference in the image
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/data/fixtures/classify:/fixtures:ro"
          cytiq:ci classify --input /fixtures/raw.fcs
          --model /fixtures/catboost --output /tmp/classified
