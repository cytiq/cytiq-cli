[workspace]
members = [
    "crates/cytiq-autospectral",
    "crates/cytiq-autospill",
    "crates/cytiq-cli",
    "crates/cytiq-cytoscan",
    "crates/cytiq-fcs",
    "crates/cytiq-gating",
    "crates/cytiq-flowsom",
    "crates/cytiq-peacoqc",
    "crates/cytiq-transform",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
