[package]
name = "cytiq-plot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "2-D and 1-D plots of FCS files as vector SVG or Plotly JSON"

[dependencies]
arrow-array = "60.1.0"
csv = "1.3.1"
cytiq-density.workspace = true
cytiq-fcs.workspace = true
cytiq-gating.workspace = true
cytiq-mask.workspace = true
cytiq-publish.workspace = true
cytiq-transform.workspace = true
log = "0.4.30"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
plotly = "0.14.1"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.150"
thiserror = "2.0.17"

[dev-dependencies]
arrow-schema = "60.1.0"
tempfile = "3"

[lints]
workspace = true
