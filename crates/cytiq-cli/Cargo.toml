[package]
name = "cytiq-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cytiq"
path = "src/main.rs"

[dependencies]
cytiq-cytonorm = { path = "../cytiq-cytonorm" }
cytiq-classify = { path = "../cytiq-classify" }
clap = { version = "4.5.38", features = ["derive"] }
cytiq-autospectral = { path = "../cytiq-autospectral" }
cytiq-autospill = { path = "../cytiq-autospill" }
cytiq-clean = { path = "../cytiq-clean" }
cytiq-compensate = { path = "../cytiq-compensate" }
cytiq-cytoscan = { path = "../cytiq-cytoscan" }
cytiq-fcs = { path = "../cytiq-fcs" }
cytiq-flowsom = { path = "../cytiq-flowsom" }
cytiq-gating = { path = "../cytiq-gating" }
cytiq-mask = { path = "../cytiq-mask" }
cytiq-meta = { path = "../cytiq-meta" }
cytiq-peacoqc = { path = "../cytiq-peacoqc" }
cytiq-plot = { path = "../cytiq-plot" }
cytiq-preflight = { path = "../cytiq-preflight" }
cytiq-provenance = { path = "../cytiq-provenance" }
cytiq-qc = { path = "../cytiq-qc" }
cytiq-spillqc = { path = "../cytiq-spillqc" }
cytiq-transform = { path = "../cytiq-transform" }
log = "0.4.30"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3"
arrow-array = "60.1.0"
csv = "1.3.1"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
sha2 = "0.11.1"

[lints]
workspace = true
